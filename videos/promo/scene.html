<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b3d2e;font-family:Georgia,'DejaVu Serif',serif}
  #stage{position:relative;width:1080px;height:1920px;
    background:radial-gradient(ellipse at 50% 45%,#1a7a52 0%,#0f5a3c 45%,#082e20 100%)}
  .card{position:absolute;left:390px;top:700px;width:300px;height:420px;border-radius:24px;background:#fdfbf5;
    box-shadow:0 18px 40px rgba(0,0,0,.45);transform-origin:50% 120%;display:flex;flex-direction:column;
    justify-content:space-between;padding:22px;box-sizing:border-box;font-weight:bold}
  .card .c{font-size:64px;line-height:1}
  .card .mid{font-size:150px;text-align:center;line-height:1}
  .card .b{font-size:64px;line-height:1;transform:rotate(180deg)}
  .red{color:#c8102e}.blk{color:#111}
  .t{position:absolute;width:100%;text-align:center;color:#f7e7b4;text-shadow:0 6px 24px rgba(0,0,0,.55)}
  #title{top:250px;font-size:128px;letter-spacing:1px;white-space:nowrap}
  #sub{top:420px;font-size:52px;color:#e8f3ec;font-style:italic}
  #g1,#g2{font-size:96px;top:1300px}
  #tag{top:1330px;font-size:70px;color:#fff}
  #url{top:1500px;font-size:56px;color:#1b1b1b;background:#f7e7b4;width:auto;left:50%;padding:22px 48px;border-radius:60px;text-shadow:none;font-family:'DejaVu Sans',sans-serif;font-weight:bold}
  #shine{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%)}
</style></head>
<body><div id="stage">
  <div id="title" class="t">Winning Hand</div>
  <div id="sub" class="t">a card room for friends</div>
  <div id="cards"></div>
  <div id="g1" class="t">Shanghai Rummy</div>
  <div id="g2" class="t">Swoop</div>
  <div id="tag" class="t">Deal in. Play free.</div>
  <div id="url" class="t">winninghand.netlify.app</div>
  <div id="shine"></div>
</div>
<script>
const CARDS=[['A','♠','blk'],['K','♥','red'],['Q','♦','red'],['J','♣','blk'],['10','♥','red']];
const wrap=document.getElementById('cards');
const els=CARDS.map(([r,s,c])=>{const d=document.createElement('div');d.className='card '+c;
  d.innerHTML=`<div class="c">${r}<br>${s}</div><div class="mid">${s}</div><div class="b">${r}<br>${s}</div>`;
  wrap.appendChild(d);return d;});
const clamp=(x)=>Math.max(0,Math.min(1,x));
const ease=(x)=>1-Math.pow(1-clamp(x),3);
const back=(x)=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const seg=(t,a,b)=>(t-a)/(b-a);
const $=id=>document.getElementById(id);
function fade(el,t,inA,inB,outA,outB,dy=40){
  let o=ease(seg(t,inA,inB)); if(outA!=null) o*=1-ease(seg(t,outA,outB));
  el.style.opacity=o; el.style.transform=(el.id==='url'?'translateX(-50%) ':'')+`translateY(${(1-ease(seg(t,inA,inB)))*dy}px)`;
}
window.render=function(t){ // t in seconds, 0..10
  // Title
  fade($('title'),t,0.2,1.0,null,null,60);
  fade($('sub'),t,0.7,1.5);
  // Cards fly in from bottom, then fan out
  els.forEach((el,i)=>{
    const k=back(seg(t,0.6+i*0.15,1.4+i*0.15));
    const fan=ease(seg(t,2.0,3.0));
    const ang=(i-2)*14*fan;
    const x=(i-2)*70*fan;
    const y=(1-k)*1300 - Math.abs(i-2)*-18*fan;
    // gentle float later
    const bob=Math.sin(t*2+i)*6*ease(seg(t,3,4));
    el.style.transform=`translate(${x}px,${y+bob}px) rotate(${ang}deg)`;
    el.style.zIndex=i;
  });
  // Game names, one after another
  fade($('g1'),t,3.0,3.6,4.8,5.3);
  fade($('g2'),t,5.3,5.9,7.0,7.4);
  // Tagline + URL
  fade($('tag'),t,7.4,8.0);
  fade($('url'),t,7.9,8.5);
  const p=$('url').style; p.transform+=` scale(${1+0.04*Math.sin(t*6)*ease(seg(t,8.5,9))})`;
  // Light sweep
  const s=seg(t,1.8,3.2); $('shine').style.transform=`translateX(${(s*2.4-1.2)*1080}px)`;
  $('shine').style.opacity=(s>0&&s<1)?1:0;
  // Fade out at the very end
  $('stage').style.opacity=1-ease(seg(t,9.5,10));
};
render(0);
</script></body></html>
